apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: roboshop
  region: us-east-1
  version: "1.34"

iam:
  withOIDC: true
  vpcResourceControllerPolicy: true

managedNodeGroups:
  - name: roboshop-nodes
    instanceType: t3.small
    amiFamily: AmazonLinux2023

    desiredCapacity: 2
    minSize: 1
    maxSize: 2

    volumeSize: 20
    volumeType: gp3

    privateNetworking: false

    ssh:
      allow: false

vpc:
  cidr: 192.168.0.0/16

  nat:
    gateway: Single

  clusterEndpoints:
    publicAccess: true
    privateAccess: false